      owner:
      # Action performed; choose one operation string from the options above.
      operation:
      # Execution path; choose one execution string from the options above.
      execution:
      # Immediate causal predecessors: list of unique A-G IDs; use [] for none.
      predecessors:
    # Operation D: identify its owner, operation, execution path, and predecessors.
    D:
      # Responsible process; choose one owner string from the options above.
      owner:
      # Action performed; choose one operation string from the options above.
      operation:
      # Execution path; choose one execution string from the options above.
      execution:
      # Immediate causal predecessors: list of unique A-G IDs; use [] for none.
      predecessors:
    # Operation E: identify its owner, operation, execution path, and predecessors.
    E:
      # Responsible process; choose one owner string from the options above.
      owner:
      # Action performed; choose one operation string from the options above.
      operation:
      # Execution path; choose one execution string from the options above.
      execution:
      # Immediate causal predecessors: list of unique A-G IDs; use [] for none.
      predecessors:
    # Operation F: identify its owner, operation, execution path, and predecessors.

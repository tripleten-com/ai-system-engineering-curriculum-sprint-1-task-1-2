# Coldline - Task 1.2
# File: submission.yaml
# Edit only answer values in submission.yaml; keep the supplied keys and types.
# Empty strings, nulls, and placeholder text are incomplete and fail verification.
# Use submission-sample.yaml for YAML formatting only; do not copy its fictional values.
# Do not include secrets, personal data, or local absolute paths.
# Use docs/student/evidence-pack.json for assessed answers; retain your required local
# investigations for the final defense.

answers:

  # Task 1.2 — Step 1: End-to-end AI request flow and exception paths
  # Identify the seven scenario operations A-G, their owners, and immediate causal predecessors. Do
  # not assign predecessor links from timestamp order alone.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # owner options (use exact values):
  # - sensor: The request-sending device or its supplied simulator.
  # - api: The application service that handles HTTP requests.
  # - worker: The background process that consumes and processes jobs.
  #
  # operation options (use exact values):
  # - send-http-alert: Send a temperature alert as an HTTP request.
  # - validate-and-persist-queued: Validate the reading and save its queued-work record.
  # - publish-job: Place the job on the supplied queue.
  # - return-http-response: Send the HTTP response to the caller.
  # - consume-job: Receive a queued job for processing.
  # - call-model-provider: Request a summary from the model provider.
  # - persist-completed-summary: Save the completed status and generated summary.
  #
  # execution options (use exact values):
  # - synchronous: Part of handling the synchronous HTTP request and response.
  # - asynchronous: Background processing that can proceed independently of the HTTP response.
  #
  # predecessors options (use exact values):
  # - A: Scenario operation A in request_flow_map.
  # - B: Scenario operation B in request_flow_map.
  # - C: Scenario operation C in request_flow_map.
  # - D: Scenario operation D in request_flow_map.
  # - E: Scenario operation E in request_flow_map.
  # - F: Scenario operation F in request_flow_map.
  # - G: Scenario operation G in request_flow_map.
  request_flow_map:
    # Operation A: identify its owner, operation, execution path, and predecessors.
    A:
      # Responsible process; choose one owner string from the options above.
      owner:
      # Action performed; choose one operation string from the options above.
      operation:
      # Execution path; choose one execution string from the options above.
      execution:
      # Immediate causal predecessors: list of unique A-G IDs; use [] for none.
      predecessors:
    # Operation B: identify its owner, operation, execution path, and predecessors.
    B:
      # Responsible process; choose one owner string from the options above.
      owner:
      # Action performed; choose one operation string from the options above.
      operation:
